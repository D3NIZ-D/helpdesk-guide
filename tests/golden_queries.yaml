# ── T3 reference cards: error codes must land exactly ────────────────
- { query: "0x0000007B",                        expect: ERR-WIN-0X7B, max_rank: 1 }
- { query: "0x0000007b mavi ekran",             expect: ERR-WIN-0X7B, max_rank: 1 }
- { query: "INACCESSIBLE_BOOT_DEVICE",          expect: ERR-WIN-0X7B, max_rank: 1 }
- { query: "169.254 ip adresi aliyor",          expect: ERR-NET-APIPA, max_rank: 1 }
- { query: "apipa adresi",                      expect: ERR-NET-APIPA, max_rank: 1 }
- { query: "yazıcı çevrimdışı görünüyor",       expect: ERR-PRN-OFFLINE, max_rank: 1 }
- { query: "printer is offline",                expect: ERR-PRN-OFFLINE, max_rank: 1 }
- { query: "event id 4740",                     expect: ERR-AD-4740, max_rank: 1 }

# ── Hard cases ───────────────────────────────────────────────────────
# None of these are aliases. They are paraphrases, colloquialisms and the
# half-sentences people actually type. A golden set where everything
# passes on day one is not measuring anything -- this block is what makes
# the number move when the lexicon or the stemmer changes.
- { query: "ekranım kapkara hiçbir şey görünmüyor", expect: DSP-001, max_rank: 2 }
- { query: "dis ekranda goruntu yok dock'a takili", expect: DSP-001, max_rank: 3 }
- { query: "ikinci monitör görüntü vermiyor",   expect: DSP-001, max_rank: 2 }
- { query: "pcnin fani donuyor ama ekran kapali", expect: DSP-001, max_rank: 3 }
- { query: "makine hic calismiyor elektrik gelmiyor", expect: PWR-001, max_rank: 2 }
- { query: "acmaya calisiyorum tepki yok",      expect: PWR-001, max_rank: 3 }
- { query: "acilirken mavi ekrana dusuyor",     expect: BOOT-001, max_rank: 2 }
- { query: "windows kurtarma ekraninda kaldi",  expect: BOOT-001, max_rank: 2 }
- { query: "siteler acilmiyor ama wifi bagli gorunuyor", expect: NET-001, max_rank: 3 }
- { query: "vpn'e baglanamiyorum internet de yok", expect: NET-001, max_rank: 3 }
- { query: "parolami girince kabul etmiyor sisteme giremedim", expect: ACC-001, max_rank: 2 }
- { query: "kullanici adi veya parola hatali diyor", expect: ACC-001, max_rank: 1 }
- { query: "yazdirmaya basiyorum bir sey olmuyor", expect: PRN-001, max_rank: 2 }
- { query: "printer bir turlu basmiyor",        expect: PRN-001, max_rank: 2 }

# Golden query set — the regression suite for search quality.
#
# Search only improves if it is measured (design doc section 13.3).  Every
# entry is a phrasing a real person might type, including the ones that
# break naive search: no Turkish characters, ALL CAPS, wrong word, English
# loanword, inflected six ways.
#
# `expect`   the record that must be returned
# `max_rank` how far down the list it may appear (1 = must be first)
#
# CI runs this on every content change.  When adding a runbook breaks an
# older query, it fails here, in the pull request -- not three weeks later
# on a phone call.
#
# When you add a record, add at least three queries for it (section 20.3).


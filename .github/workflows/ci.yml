name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          # Turkish casing and SQLite FTS5 behaviour are the two things
          # most likely to differ per platform, so the full matrix runs
          # the suite rather than a smoke test.
          - os: ubuntu-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[web,dev]"

      - name: Lint
        run: ruff check src tests

      - name: Verify FTS5 is available
        # Without FTS5 the search silently degrades to alias-only matching,
        # which is much harder to notice than a failing build.
        run: python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute('CREATE VIRTUAL TABLE t USING fts5(x)'); print('FTS5 ok')"

      - name: Tests
        run: pytest -q

      - name: Compile content (strict)
        run: helpdesk compile --strict

      - name: Search quality
        run: helpdesk eval --min-recall 0.90

  install-smoke:
    # The five-minute rule: a stranger must be able to install and run it.
    name: install from a clean environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the core only, with no extras
        run: pip install .
      - name: The core must work without the web dependencies
        run: |
          helpdesk --version
          helpdesk compile
          helpdesk search "monitorum calismiyor"
          helpdesk stats
      - name: The web extra must report itself clearly when missing
        run: |
          if helpdesk serve --no-browser 2>&1 | grep -q "web' extra"; then
            echo "clear error message: ok"
          else
            echo "serve should explain that the web extra is required"; exit 1
          fi

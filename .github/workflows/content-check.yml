name: Content

# Runs only when content changes. Content pull requests come from people
# who may not write code, so this workflow is written to give them a
# readable answer rather than a stack trace.

on:
  pull_request:
    paths:
      - "content/**"
      - "tests/golden_queries.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Schema, graph integrity and secret scan
        run: helpdesk lint --strict

      - name: Compile
        run: helpdesk compile --strict

      - name: Search regression (golden query set)
        run: helpdesk eval --min-recall 0.90

      - name: Render decision trees for review
        id: trees
        # A reviewer should be able to check the logic without reading
        # YAML, so CI draws the tree in the pull request itself.
        run: |
          {
            echo "## Decision trees in this change"
            echo
            for file in $(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'content/runbooks/**'); do
              [ -f "$file" ] || continue
              echo "<details><summary><code>$file</code></summary>"
              echo
              echo '```text'
              helpdesk tree "$file" || echo "(could not render)"
              echo '```'
              echo
              echo "</details>"
              echo
            done
          } > trees.md
          cat trees.md

      - name: Post the trees as a comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('trees.md', 'utf8');
            if (body.trim().split('\n').length < 3) return;
            const marker = '## Decision trees in this change';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

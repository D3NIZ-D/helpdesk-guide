code: PWR-002
tier: runbook
title: "Laptop şarj olmuyor"
summary: "Adaptör takılı ama pil dolmuyor, yavaş doluyor veya belli bir yüzdede duruyor."
category: donanim/guc
severity: orta
status: yayinda

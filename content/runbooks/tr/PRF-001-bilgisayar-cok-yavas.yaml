      {{/each}}
      Diskte SMART uyarısı tespit edildi. Yedek durumu ve disk modeli
      bilete eklenmeli. Donanım değişimi gerekiyor.
      {{closing}}

  - key: N93
    type: eskalasyon
    title: "Zararlı yazılım bulundu — SEC-002 ile devam et"
    body_md: |
      Tarama bir tehdit buldu. Bu artık bir performans vakası değil,
      bir güvenlik vakasıdır.

      Bu runbook'u kapat ve **SEC-002 Antivirüs uyarısı / karantina** ile
      devam et. Temizleyip geçme — bulaşmanın nasıl olduğu araştırılmalı.
    escalate_to: "SEC-002"

related: [PRF-002, SEC-002]

# Bu runbook, NET-014 ile karıştırılmaya müsait ve ayrım önemli:
#
#   NET-014  paylaşıma ULAŞILAMIYOR      — sürücü bağlanmıyor, yol bulunamıyor
#   ACC-003  paylaşıma ULAŞILIYOR ama    — "erişim reddedildi", yetki yok
#
# İkisini ayıran soru "hangi mesaj çıkıyor" sorusudur; ağ sorununu yetki
# sorunu sanmak, veri sahibine gereksiz bir yetki talebi göndermek demektir.


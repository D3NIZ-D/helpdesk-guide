code: ACC-001
tier: runbook
title: "Hesap kilitli veya parola kabul edilmiyor"
summary: "Kullanıcı oturum açamıyor; parola reddediliyor ya da hesap kilitlenmiş."
category: hesap/kimlik
severity: yuksek
status: yayinda

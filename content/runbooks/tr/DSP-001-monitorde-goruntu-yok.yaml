      Belirti: {{query_raw}}
      Runbook: {{record_code}} v{{version}} — {{record_title}}
      Bağlam: {{context}}

      İzlenen adımlar:
      {{#each steps}}  {{order}}. {{title}} → {{answer}}
      {{/each}}

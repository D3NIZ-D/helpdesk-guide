# ⚠ Bu runbook'un varsayılan çıktısı "temizle ve devam et" DEĞİLDİR.
#
# Bir antivirüs uyarısı iki şeyden biridir: gerçek bir bulaşma ya da yanlış
# pozitif. İkisini L1 ayıramaz, ve yanlış tarafa düşmenin maliyeti simetrik
# değildir — yanlış pozitifi eskale etmek yarım saat kaybettirir, gerçek
# bulaşmayı "temizledim" diye kapatmak bir olayı gizler.
#
# Bu ağaçta hiçbir dal teknisyeni karantinadan dosya geri yüklemeye,
# taramayı devre dışı bırakmaya veya istisna tanımlamaya tek başına
# yetkilendirmez. Bu kararlar güvenlik ekibinindir.


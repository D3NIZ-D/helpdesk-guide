      {{closing}}

  - key: N91
    type: eskalasyon
    title: "Kimlik doğrulanamadı — sıfırlama yapma"
    body_md: |
      Arayanın iddia ettiği kişi olduğu doğrulanamadı. **Hiçbir faktörü
      sıfırlama.**

      1. Kullanıcıya neden bekletildiğini sakin ve suçlayıcı olmadan açıkla.
      2. Yüz yüze doğrulama veya yöneticisinden onay gibi alternatif bir yol öner.
      3. Israr veya baskı varsa bunu bilete **yaz** ve güvenlik ekibine bildir —
         baskı, sosyal mühendisliğin en yaygın işaretidir.

      Bu adımda "hayır" demek, aracın var olma sebebidir.
    escalate_to: "Guvenlik-Ekibi / Ekip-Yoneticisi"

  - key: N92
    type: eskalasyon
    title: "Kimlik yönetimi ekibine eskale et"
    body_md: |
      L1 yetkisiyle çözülemedi. Özete **hangi adımların denendiğini**, kimliğin
      doğrulanıp doğrulanmadığını ve MFA'nın sıfırlanıp sıfırlanmadığını
      açıkça yaz.

      Sıfırlama yapıldıysa mutlaka belirt — L2 aynı işlemi tekrarlamasın.
    escalate_to: "L2-Kimlik"


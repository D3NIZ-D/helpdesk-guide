# Bu runbook bir kimlik doğrulama faktörünü sıfırlıyor. Sıfırlamadan önce
# kimlik doğrulaması yapmak, sosyal mühendislikle hesap ele geçirmenin en
# kolay yolunu kapatan tek adımdır — ve tam olarak atlanmaya en müsait adım
# odur, çünkü arayan kişi acelesi olduğunu söyler.


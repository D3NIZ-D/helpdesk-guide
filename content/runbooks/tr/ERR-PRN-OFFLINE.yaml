likely_causes:
  - "'Yazıcıyı çevrimdışı kullan' seçeneği elle işaretlenmiş"
  - "Yazıcının IP adresi DHCP ile değişmiş, port eski adresi gösteriyor"
  - "SNMP durum sorgusu engelleniyor; Windows cihazı kapalı sanıyor"
  - "Yazıcı uyku modundan uyanmıyor"

fix_summary: |
  Önce yazıcı menüsünden "Çevrimdışı kullan" işaretini kaldır. Durum
  değişmiyorsa yazıcının panelinden IP adresini oku ve port ayarındaki
  adresle karşılaştır; farklıysa DHCP adresi değiştirmiştir. Kalıcı çözüm
  DHCP rezervasyonudur. Adres doğruysa port ayarlarında **SNMP durum
  bilgisini devre dışı bırak** — pek çok ağ yazıcısı bu sorguya cevap
  vermez ve Windows bunu "kapalı" diye yorumlar.


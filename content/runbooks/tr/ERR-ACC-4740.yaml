  - { term: "4740 olay kaydı",      kind: hata_kodu, weight: 1.3 }
  - { term: "hesap kilitlenme kaydı", kind: belirti, weight: 1.0 }

likely_causes:
  - "Telefon veya tablette eski parolayla kayıtlı kurumsal e-posta hesabı"
  - "Credential Manager'da kalmış eski kimlik bilgisi"
  - "Kullanıcı adına çalışan planlanmış görev veya Windows servisi"
  - "Eşlenmiş ağ sürücüsü eski parolayla yeniden bağlanmaya çalışıyor"
  - "Açık kalmış bir uzak masaüstü oturumu"

fix_summary: |
  4740 olayı hesabın kilitlendiğini söyler; asıl bilgi olayın içindeki
  **çağıran bilgisayar adıdır** — kilidi kim tetikledi. Kaynağı bulmadan
  kilidi açmak işe yaramaz, hesap birkaç dakika içinde yeniden kilitlenir.
  Önce kaynak cihazdaki eski kimlik bilgisini temizle, sonra kilidi aç.

source:

title: "Yazıcı çıktı vermiyor / iş kuyrukta kalıyor"
summary: "Yazdırma işi gönderiliyor ama kâğıt çıkmıyor; iş kuyrukta bekliyor."
category: yazici/cikti
severity: orta
status: yayinda
verification: dogrulanmis
author: "helpdesk-guide"

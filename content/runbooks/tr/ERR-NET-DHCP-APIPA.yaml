fix_summary: |
  169.254 ile başlayan bir adres, Windows'un DHCP'den cevap alamayınca
  kendine verdiği adrestir — yani sorun cihazın IP ayarlarında değil,
  DHCP'ye ulaşmasındadır. Önce `ipconfig /release && ipconfig /renew`
  dene. Aynı prizdeki başka bir cihaz da adres alamıyorsa bu bir kullanıcı
  arızası değil altyapı arızasıdır; tek tek cihazlarla uğraşmayı bırak ve
  ağ ekibini ara.


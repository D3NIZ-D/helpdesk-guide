# ⚠ Bu runbook'un çıktısı genelde "çöz" değildir.
#
# Şüpheli e-posta akışı yanlış tasarlanırsa, teknisyeni "bir bakayım"
# diyerek zararlı eki açmaya iten bir prosedür yazılmış olur. Bu ağaçta
# hiçbir dal eki açmaya, bağlantıya tıklamaya veya göndereni yanıtlamaya
# yönlendirmez. Amaç: durumu sınıflandır, kanıtı bozmadan ilet, eskale et.


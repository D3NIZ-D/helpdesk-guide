  bsod: mavi ekran
  osd: monitör menüsü
  ad: active directory
  dc: etki alanı denetleyicisi
  gpo: grup ilkesi
  rdp: uzak masaüstü
  nas: ağ depolama
  dhcp: otomatik ip
  dns: ad çözümleme

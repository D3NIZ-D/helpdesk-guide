            güç kablosu, priz, uzatma, uzatma kablosu, çoklu priz, akım korumalı priz]

  yazici:
    weight: 1.1
    terms: [yazıcı, printer, lazer yazıcı, mürekkep püskürtmeli, çok fonksiyonlu,
            tarayıcı, fotokopi, mfp, kopya makinesi, çıktı cihazı]


# Device and component vocabulary (Turkish).
#
# Each key is a canonical concept; `terms` are the surface forms a user
# might actually type -- including English loanwords, misspellings and
# the words people use when they do not know the right one ("kasa" for a
# desktop tower, "kutu" for anything with a power light).
#
# Everything here is folded to ASCII and lowercased at load time, so
# "Monitör" and "monitor" are the same entry.  Synonyms expand the FTS
# query: searching "ekran" also searches "monitor", "display" and "lcd".
#
# This is the cheap half of Turkish search (design doc section 8.1): a
# rich vocabulary means the stemmer has less to get wrong.

devices:
  monitor:
    weight: 1.0
    terms: [monitör, monitor, ekran, display, lcd, led ekran, panel, göstergeç,
            harici ekran, ikinci ekran, dış ekran]

  bilgisayar:
    terms: [bilgisayar, pc, kasa, masaüstü, desktop, makine, cihaz, sistem,
            iş istasyonu, workstation]

  laptop:
    terms: [laptop, dizüstü, notebook, taşınabilir bilgisayar, diz üstü]

  dock:
    terms: [dock, docking, docking station, yerleştirme istasyonu, hub,
            usb hub, usb-c hub, çoklayıcı, port çoğaltıcı]

  kablo:
    terms: [kablo, hdmi, displayport, dp, vga, dvi, usb-c, type-c, thunderbolt,
            görüntü kablosu, video kablosu, ara kablo]

  guc_kaynagi:

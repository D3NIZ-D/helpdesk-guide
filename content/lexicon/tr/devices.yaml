            globalprotect, anyconnect, openvpn, wireguard]

  hesap:
    terms: [hesap, kullanıcı, kullanıcı adı, account, şifre, parola, password,
            domain hesabı, ad hesabı, active directory hesabı]

  mfa:
    terms: [mfa, 2fa, iki adımlı doğrulama, çok faktörlü, authenticator,
            doğrulama kodu, otp, token, sms kodu]

  eposta:
    terms: [e-posta, eposta, mail, outlook, posta, exchange, webmail, owa,

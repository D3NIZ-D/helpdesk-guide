  ses:
    terms: [ses, hoparlör, kulaklık, mikrofon, headset, mic, audio, ses kartı,
            ses aygıtı]

  klavye_mouse:
    terms: [klavye, mouse, fare, keyboard, imleç, touchpad, dokunmatik yüzey,
            trackpad, çevre birimi, usb aygıt, usb cihaz]

  disk:
    terms: [disk, sabit disk, hdd, ssd, nvme, depolama, c sürücüsü, harddisk,
            harici disk, flash bellek, usb bellek]

  isletim_sistemi:
    terms: [windows, işletim sistemi, os, win11, win10, windows 11, windows 10,
